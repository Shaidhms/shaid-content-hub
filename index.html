<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaid | Content Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #191923;
      --surface: #22222f;
      --border: rgba(255,255,255,0.07);
      --text: #ede8df;
      --muted: #888;
      --accent: #d4826a;
      --accent-dim: rgba(212,130,106,0.12);
      --green: #5cb88a;
      --green-dim: rgba(92,184,138,0.12);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    nav {
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .nav-brand { font-size: 16px; font-weight: 700; }
    .nav-brand span { color: var(--accent); }
    .nav-meta { font-size: 13px; color: var(--muted); }

    .hero {
      padding: 56px 40px 32px;
      max-width: 960px;
      margin: 0 auto;
    }
    .hero h1 {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .hero h1 span { color: var(--accent); }
    .hero p { color: var(--muted); font-size: 15px; }

    .filters {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 40px 28px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .count-badge { margin-left: auto; font-size: 13px; color: var(--muted); }

    .content {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    .date-group { margin-bottom: 40px; }
    .date-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .card:hover { border-color: rgba(255,255,255,0.15); }

    .type-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 72px;
      text-align: center;
    }
    .type-badge.carousel {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(212,130,106,0.3);
    }
    .type-badge.post {
      background: var(--green-dim);
      color: var(--green);
      border: 1px solid rgba(92,184,138,0.3);
    }

    .card-title { flex: 1; font-size: 15px; font-weight: 600; }

    .card-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 7px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.8; }
    .btn-pdf { background: var(--accent); color: #fff; }
    .btn-txt { background: var(--green); color: #fff; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 0;
      font-size: 15px;
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      nav, .hero, .filters, .content { padding-left: 20px; padding-right: 20px; }
      .hero h1 { font-size: 26px; }
      .card { flex-wrap: wrap; }
      .card-actions { width: 100%; justify-content: flex-end; }
      .count-badge { margin-left: 0; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">Shaid <span>| Content Hub</span></div>
  <div class="nav-meta">GenAI Architect & Builder</div>
</nav>

<div class="hero">
  <h1>Carousels &amp; <span>LinkedIn Posts</span></h1>
  <p>All content in one place. Download PDFs and post drafts directly.</p>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="carousel">Carousels</button>
  <button class="filter-btn" data-filter="post">LinkedIn Posts</button>
  <span class="count-badge" id="countBadge"></span>
</div>

<div class="content" id="contentArea">
  <div class="empty">Loading content...</div>
</div>

<footer>
  Shaid &nbsp;·&nbsp; GenAI Architect &amp; Builder &nbsp;·&nbsp;
  <a href="https://linkedin.com/in/shaidhms" target="_blank">LinkedIn</a>
  &nbsp;·&nbsp; Turning Ideas into Reality
</footer>

<script>
  const ICONS = {
    download: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
    eye: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
  };

  let allItems = [];
  let currentFilter = 'all';

  function formatDate(d) {
    const [y, m, day] = d.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m,10)-1]} ${parseInt(day,10)}, ${y}`;
  }

  function groupByDate(items) {
    return items.reduce((acc, item) => {
      if (!acc[item.date]) acc[item.date] = [];
      acc[item.date].push(item);
      return acc;
    }, {});
  }

  function renderCard(item) {
    const typeLabel = item.type === 'carousel' ? 'Carousel' : 'Post';
    const pdfBtn = item.pdf
      ? `<a class="btn btn-pdf" href="${item.pdf}" download>${ICONS.download} PDF</a>`
      : '';
    const txtBtn = item.txt
      ? `<a class="btn btn-txt" href="${item.txt}" download>${ICONS.download} Post</a>`
      : '';
    const previewBtn = item.pdf
      ? `<a class="btn btn-ghost" href="${item.pdf}" target="_blank" title="Preview in browser">${ICONS.eye}</a>`
      : '';

    return `
      <div class="card">
        <span class="type-badge ${item.type}">${typeLabel}</span>
        <span class="card-title">${item.title}</span>
        <div class="card-actions">${pdfBtn}${txtBtn}${previewBtn}</div>
      </div>`;
  }

  function render(filter) {
    const items = filter === 'all' ? allItems : allItems.filter(i => i.type === filter);
    const groups = groupByDate(items);
    const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

    document.getElementById('countBadge').textContent =
      `${items.length} item${items.length !== 1 ? 's' : ''}`;

    if (items.length === 0) {
      document.getElementById('contentArea').innerHTML =
        '<div class="empty">No content found.</div>';
      return;
    }

    document.getElementById('contentArea').innerHTML = dates.map(date => `
      <div class="date-group">
        <div class="date-label">${formatDate(date)}</div>
        ${groups[date].map(renderCard).join('')}
      </div>`).join('');
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render(currentFilter);
    });
  });

  fetch('content-manifest.json')
    .then(r => r.json())
    .then(data => { allItems = data; render(currentFilter); })
    .catch(() => {
      document.getElementById('contentArea').innerHTML =
        '<div class="empty">Could not load content. Make sure content-manifest.json is in the repo.</div>';
    });
</script>
</body>
</html>
